name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      mac_arm_runner:
        description: GitHub-hosted Apple Silicon image
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.mac_arm_runner || 'macos-15' }}
            platform: mac
            arch: arm64
          - runner: windows-latest
            platform: win
            arch: x64
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Clean release audit
        run: node scripts/clean-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm ci --prefix desktop/app --omit=optional --ignore-scripts --no-audit --no-fund
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Build installer
        run: node desktop/package.mjs --${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Verify Windows DSH Desktop launcher
        if: matrix.platform == 'win'
        run: node desktop/check-windows-dsh-launcher.mjs
      - name: Install, launch and remove macOS app
        if: matrix.platform == 'mac'
        run: node desktop/check-mac-install.mjs
      - name: Install, launch and uninstall Windows app
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./desktop/check-windows-install.ps1
      - name: Upload installers and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuanDeck-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            output/installers/*.dmg
            output/installers/*.exe
            output/installer-manifest-darwin-arm64.json
            output/installer-manifest-win32-x64.json
            output/mac-install-check-arm64.json
            output/windows-install-check.json
            output/dsh-launcher-install-check.json
          if-no-files-found: error
          retention-days: 14
