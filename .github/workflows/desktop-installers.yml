name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Build installer
        run: node desktop/package.mjs --${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Install, launch and remove macOS app
        if: matrix.platform == 'mac'
        run: node desktop/check-mac-install.mjs
      - name: Install, launch and uninstall Windows app
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./desktop/check-windows-install.ps1
      - name: Upload installers and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuanDeck-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            output/installers/*.dmg
            output/installers/*.exe
            output/*manifest*.json
            output/*install-check*.json
          if-no-files-found: error
          retention-days: 14
