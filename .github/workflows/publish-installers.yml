name: Publish verified installers

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop installers run ID
        required: true
        type: string
      source_sha:
        description: Exact source commit used by the installer build
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        default: 'v0.7.0'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-installers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Test publication validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate original build and publish its installers
        run: python3 .github/scripts/publish-installers.py
      - name: Preserve release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-release-verification
          path: |
            output/publish/SHA256SUMS.txt
            output/publish/verification.json
          if-no-files-found: ignore
          retention-days: 30
